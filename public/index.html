<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Broker Sintetik</title>
    <!-- Versi rasmi TradingView Lightweight Charts terkini -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #131722; color: white; font-family: sans-serif; overflow: hidden; }
        #chart { width: 100vw; height: 100vh; }
        .watermark { position: absolute; top: 20px; left: 20px; z-index: 10; font-size: 24px; font-weight: bold; }
        .status { position: absolute; top: 55px; left: 20px; z-index: 10; font-size: 14px; color: #ffeb3b; }
    </style>
</head>
<body>
    <div class="watermark">Custom Vol 80</div>
    <div class="status" id="status">Memulakan carta...</div>
    <div id="chart"></div>

    <script>
        window.onerror = function(msg, url, line) {
            document.getElementById('status').innerText = "Ralat JS: " + msg + " (Baris " + line + ")";
            return false;
        };

        const chartProperties = {
            width: window.innerWidth,
            height: window.innerHeight,
            layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#1f293d' }, horzLines: { color: '#1f293d' } },
            timeScale: { timeVisible: true, secondsVisible: true }
        };
        
        const chart = LightweightCharts.createChart(document.getElementById('chart'), chartProperties);
        
        // Sokongan dua-dalam-satu: menyokong versi baharu (addSeries) & versi lama (addLineSeries)
        let lineSeries;
        if (typeof chart.addSeries === 'function' && LightweightCharts.LineSeries) {
            lineSeries = chart.addSeries(LightweightCharts.LineSeries, { color: '#2962FF', lineWidth: 2 });
        } else {
            lineSeries = chart.addLineSeries({ color: '#2962FF', lineWidth: 2 });
        }

        const socket = io(); 
        const statusDiv = document.getElementById('status');

        socket.on('connect', () => {
            statusDiv.innerText = "Bersambung ke pelayan...";
        });

        socket.on('history', (data) => {
            lineSeries.setData(data);
            chart.timeScale().fitContent(); // Laraskan skrin supaya seluruh garisan muat secara automatik
            statusDiv.innerText = "Graf sedia. Menerima data masa nyata...";
        });

        socket.on('tick', (data) => {
            lineSeries.update(data);
            statusDiv.innerText = `Harga Semasa: ${data.value.toFixed(2)}`;
        });

        window.addEventListener('resize', () => {
            chart.resize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
