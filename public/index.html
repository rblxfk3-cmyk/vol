<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Broker Sintetik</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #131722; color: white; font-family: sans-serif; overflow: hidden; }
        #chart { width: 100vw; height: 100vh; }
        .watermark { position: absolute; top: 20px; left: 20px; z-index: 10; font-size: 24px; font-weight: bold; }
        .status { position: absolute; top: 55px; left: 20px; z-index: 10; font-size: 14px; color: #ffeb3b; }
    </style>
</head>
<body>
    <div class="watermark">Custom Vol 80</div>
    <div class="status" id="status">0. Skrip bermula...</div>
    <div id="chart"></div>

    <script>
        // Tangkap semua jenis error tersembunyi dan cetak ke skrin
        window.onerror = function(msg, url, line) {
            document.getElementById('status').innerText = "Ralat JS: " + msg + " (Baris " + line + ")";
            return false;
        };

        document.getElementById('status').innerText = "1. Melukis ruang graf...";

        const chartProperties = {
            width: window.innerWidth,
            height: window.innerHeight,
            layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#1f293d' }, horzLines: { color: '#1f293d' } },
            timeScale: { timeVisible: true, secondsVisible: true }
        };
        
        const chart = LightweightCharts.createChart(document.getElementById('chart'), chartProperties);
        const lineSeries = chart.addLineSeries({ color: '#2962FF', lineWidth: 2 });

        document.getElementById('status').innerText = "2. Menyambung ke server...";

        const socket = io(); 
        const statusDiv = document.getElementById('status');

        socket.on('connect', () => {
            statusDiv.innerText = "3. Berjaya sambung! Menunggu data sejarah...";
        });

        socket.on('connect_error', (err) => {
            statusDiv.innerText = "Ralat WebSocket: " + err.message;
        });

        socket.on('history', (data) => {
            try {
                lineSeries.setData(data);
                statusDiv.innerText = "4. Graf sedia. Menunggu live tick...";
            } catch (error) {
                statusDiv.innerText = "Ralat Graf: " + error.message;
            }
        });

        socket.on('tick', (data) => {
            try {
                lineSeries.update(data);
                statusDiv.innerText = `Live Price: ${data.value.toFixed(2)}`;
            } catch (error) {
                // Abaikan ralat kemas kini tick
            }
        });

        window.addEventListener('resize', () => {
            chart.resize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
